# ──────────────────────────────────────────────────────────────────────────────
# Workflow: CI — CloudWatch Dashboards
#
# Owner: Sridhar
#
# Triggers on pushes to feature/** or feat/** branches when files under
# lib/topics/03-cloudwatch-dashboards/** change.
# Also triggers on pull requests targeting main for the same paths.
# Triggers on pushes to main for the same paths to run the deploy job.
#
# Uses the shared composite action (.github/actions/cdk-ci).
# ──────────────────────────────────────────────────────────────────────────────
name: CI — CloudWatch Dashboards (Sridhar)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - main
    paths:
      - 'lib/topics/03-cloudwatch-dashboards/**'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/topics/03-cloudwatch-dashboards/**'

jobs:
  build-and-synth:
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: ./.github/actions/cdk-ci
        with:
          stack-name: 'CloudWatchDashboardsStack'
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: 'us-east-1'

  deploy:
    needs: build-and-synth
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy
        run: npx cdk deploy CloudWatchDashboardsStack --require-approval never
