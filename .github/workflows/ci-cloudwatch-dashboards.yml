# ──────────────────────────────────────────────────────────────────────────────
# Workflow: CI — CloudWatch Dashboards
#
# Owner: Sridhar
#
# Triggers on pushes to feature/** or feat/** branches when files under
# lib/topics/03-cloudwatch-dashboards/** change.
# Also triggers on pull requests targeting main for the same paths.
# Triggers on pushes to main for the same paths to run the deploy job.
#
# Uses the shared composite action (.github/actions/cdk-ci).
# ──────────────────────────────────────────────────────────────────────────────
name: CI — CloudWatch Dashboards (Sridhar)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'lib/topics/03-cloudwatch-dashboards/**'

jobs:
  build-and-synth:
    runs-on: ubuntu-latest
    environment: Dev
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cdk-ci
        with:
          stack-name: 'CloudWatchDashboardsStack'
          aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
          aws-region: 'us-east-1'

  deploy:
    needs: build-and-synth
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Dev
    env:
      CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Bootstrap CDK
        run: npx cdk bootstrap aws://${{ vars.AWS_ACCOUNT_ID }}/us-east-1
      - name: Deploy
        run: |
          # Use vars.AWS_ACCOUNT_ID if set, otherwise extract from cdk.context.json
          if [ -z "$CDK_DEFAULT_ACCOUNT" ]; then
            CDK_DEFAULT_ACCOUNT=$(node -e "
              const fs = require('fs');
              try {
                const ctx = JSON.parse(fs.readFileSync('cdk.context.json','utf8'));
                const key = Object.keys(ctx).find(k => k.startsWith('vpc-provider:account='));
                if (key) { const m = key.match(/account=([^:]+)/); if (m) process.stdout.write(m[1]); }
              } catch(e) {}
            ")
            export CDK_DEFAULT_ACCOUNT
          fi
          # Clear cached dummy VPC context so CDK fetches real VPC from AWS
          node -e "
            const fs = require('fs');
            try {
              const ctx = JSON.parse(fs.readFileSync('cdk.context.json','utf8'));
              const cleaned = Object.fromEntries(
                Object.entries(ctx).filter(([k]) => !k.startsWith('vpc-provider:'))
              );
              fs.writeFileSync('cdk.context.json', JSON.stringify(cleaned, null, 2));
            } catch(e) {}
          "
          npx cdk deploy CloudWatchDashboardsStack --require-approval never --verbose
