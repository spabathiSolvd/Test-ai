# ──────────────────────────────────────────────────────────────────────────────
# Workflow: CI — EKS Migration
#
# Owner: Harish Ramineni
#
# Triggers on pushes to feature/** or feat/** branches when files under
# lib/topics/02-eks-migration/** change.
# Also triggers on pull requests targeting main for the same paths.
#
# Uses the shared composite action (.github/actions/cdk-ci).
# ──────────────────────────────────────────────────────────────────────────────
name: CI — EKS Migration (Harish)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'lib/topics/02-eks-migration/**'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/topics/02-eks-migration/**'

jobs:
  build-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cdk-ci
        with:
          stack-name: 'EksMigrationStack'
