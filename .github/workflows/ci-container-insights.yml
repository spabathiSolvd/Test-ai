# ──────────────────────────────────────────────────────────────────────────────
# Workflow: CI — Container Insights
#
# Owner: Ronak
#
# Triggers on pushes to feature/** or feat/** branches when files under
# lib/topics/04-container-insights/** change.
# Also triggers on pull requests targeting main for the same paths.
#
# Uses the shared composite action (.github/actions/cdk-ci).
# ──────────────────────────────────────────────────────────────────────────────
name: CI — Container Insights (Ronak)

on:
  push:
    branches:
      - 'feature/**'
      - 'feat/**'
    paths:
      - 'lib/topics/04-container-insights/**'
  pull_request:
    branches:
      - main
    paths:
      - 'lib/topics/04-container-insights/**'

jobs:
  build-and-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cdk-ci
        with:
          stack-name: 'ContainerInsightsStack'
